name: Build experimental OCI archive

on:
  workflow_dispatch:
    inputs:
      kit_revision:
        description: Exact 40-character ca-x/oci-kit commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: pond-oci
      - env:
          KIT_REVISION: ${{ inputs.kit_revision }}
        run: '[[ "$KIT_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ca-x/oci-kit
          ref: ${{ inputs.kit_revision }}
          path: oci-kit
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --locked --release --manifest-path oci-kit/Cargo.toml -p oci-kit --bin rootfs-fetch
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - env:
          GH_TOKEN: ${{ github.token }}
          ROOTFS_FETCH: ${{ github.workspace }}/oci-kit/target/release/rootfs-fetch
        run: bash pond-oci/scripts/fetch-rootfs.sh
      - env:
          ROOTFS_FETCH: ${{ github.workspace }}/oci-kit/target/release/rootfs-fetch
          KIT_SOURCE: ${{ github.workspace }}/oci-kit
        run: bash pond-oci/scripts/build.sh
