name: Inspect an existing Pond probe report

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed probe run ID (this repository only)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate run identifier
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: '[[ "$RUN_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pond-real-payload-report
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/probe-report
      - name: Print bounded diagnostic tails on GitHub only
        shell: bash
        run: |
          set -euo pipefail
          for name in evidence.json commands.log desktop.log xvfb.log pond-ipc.txt; do
            path="$RUNNER_TEMP/probe-report/$name"
            if [[ -f "$path" && ! -L "$path" ]]; then
              printf '\n--- %s ---\n' "$name"
              tail -c 24000 -- "$path"
            fi
          done
