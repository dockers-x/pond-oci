name: Probe desktop packaging metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools attr acl libcap2-bin umoci skopeo
      - run: sudo env GITHUB_ACTIONS=true GITHUB_SERVER_URL="$GITHUB_SERVER_URL" RUNNER_TEMP="$RUNNER_TEMP" bash scripts/probe-packaging.sh
