name: Probe final OCI systemd boot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  boot:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download only the accepted candidate on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS:-}" == true && "${GITHUB_SERVER_URL:-}" == https://github.com && -z "${ACT:-}" ]]
          run="$(jq -er '.run_id | select(type == "number")' candidate.json)"
          revision="$(jq -er '.recipe_revision | select(test("^[0-9a-f]{40}$"))' candidate.json)"
          gh api "repos/$REPOSITORY/actions/runs/$run" > "$RUNNER_TEMP/candidate-source.json"
          jq -e --arg revision "$revision" '.conclusion == "success" and .head_sha == $revision and .path == ".github/workflows/probe-remote-desktop.yml"' "$RUNNER_TEMP/candidate-source.json"
          gh run download "$run" --repo "$REPOSITORY" --name pond-desktop-amd64-candidate --dir "$RUNNER_TEMP/accepted-candidate"
          expected="$(jq -er '.archive_sha256 | select(test("^[0-9a-f]{64}$"))' candidate.json)"
          actual="$(sha256sum "$RUNNER_TEMP/accepted-candidate/pond-desktop.oci.tar" | cut -d ' ' -f1)"
          [[ "$actual" == "$expected" ]]
      - name: Import the exact verified OCI archive into the disposable runner daemon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          sudo skopeo copy "oci-archive:$RUNNER_TEMP/accepted-candidate/pond-desktop.oci.tar" "docker-daemon:pond-systemd-ci:$GITHUB_RUN_ID"
      - name: Exercise real PID1 boot, platform ordering and adapter idempotence
        shell: bash
        run: |
          set -euo pipefail
          sudo env GITHUB_ACTIONS=true GITHUB_SERVER_URL="$GITHUB_SERVER_URL" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            bash scripts/probe-systemd.sh "pond-systemd-ci:$GITHUB_RUN_ID"
      - name: Print bounded synthetic boot diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /proc/sys/kernel/random/uuid)"
          trap 'printf "::%s::\n" "$token"' EXIT
          printf '::stop-commands::%s\n' "$token"
          shopt -s nullglob
          for path in "$RUNNER_TEMP/pond-systemd-report/"*; do
            [[ -f "$path" && ! -L "$path" ]] || continue
            printf '\n--- %s ---\n' "${path##*/}"
            sudo tail -c 18000 -- "$path"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pond-systemd-report
          path: ${{ runner.temp }}/pond-systemd-report
          if-no-files-found: ignore
          retention-days: 7
