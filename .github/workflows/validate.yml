name: Validate recipe

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s tests -v
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/*.yml
      - run: bash -n scripts/fetch-rootfs.sh scripts/build.sh scripts/stage-desktop.sh scripts/probe-packaging.sh scripts/package-desktop.sh scripts/probe-systemd.sh tests/fixtures/pond-ci-platform-setup.sh
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools attr acl libcap2-bin umoci skopeo
      - run: sudo env GITHUB_ACTIONS=true GITHUB_SERVER_URL="$GITHUB_SERVER_URL" RUNNER_TEMP="$RUNNER_TEMP" bash scripts/probe-packaging.sh
  toolkit-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: pond-oci
      - name: Read the recipe's locked toolkit revision
        id: metadata
        run: python3 pond-oci/scripts/image-metadata.py --revision "$GITHUB_SHA" --format github >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ca-x/oci-kit
          ref: ${{ steps.metadata.outputs.kit_revision }}
          path: oci-kit
      - run: rustup toolchain install stable --profile minimal
      - name: Build the actual offline Rust commands on GitHub
        run: cargo +stable build --locked --manifest-path oci-kit/Cargo.toml --workspace --bin lighos-init --bin rootfs-cleaner
      - name: Install the Pond profile into an isolated staging fixture
        env:
          LIGHTOS_INIT_BINARY: ${{ github.workspace }}/oci-kit/target/debug/lighos-init
          ROOTFS_CLEANER_BINARY: ${{ github.workspace }}/oci-kit/target/debug/rootfs-cleaner
        run: python3 -m unittest discover -s pond-oci/tests -p test_lightos_profile.py -v
