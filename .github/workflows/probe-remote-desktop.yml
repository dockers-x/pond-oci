name: Probe real Pond shell through remote desktop

on:
  workflow_dispatch:
    inputs:
      inspect_run:
        description: Inspect an existing fixture report on GitHub instead of rebuilding
        required: false
        type: string
      build_candidate:
        description: Build an unpublished amd64 desktop OCI candidate after the real desktop probe passes
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  inspect-report:
    if: github.server_url == 'https://github.com' && inputs.inspect_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Inspect only bounded synthetic fixture diagnostics on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RUN: ${{ inputs.inspect_run }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS:-}" == true && "${GITHUB_SERVER_URL:-}" == https://github.com && -z "${ACT:-}" ]]
          [[ "$PROBE_RUN" =~ ^[0-9]+$ ]]
          report="$RUNNER_TEMP/prior-probe-report"
          gh run download "$PROBE_RUN" --repo "$REPOSITORY" --name pond-remote-desktop-report --dir "$report"
          if ! command -v identify >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          token="$(cat /proc/sys/kernel/random/uuid)"
          trap 'printf "::%s::\n" "$token"' EXIT
          printf '::stop-commands::%s\n' "$token"
          trace="$report/native-syscalls.log"
          [[ -f "$trace" && ! -L "$trace" ]]
          printf '\n--- Buffer, device and socket failures ---\n'
          awk '/\/dev\/shm|memfd_create|ftruncate|EACCES|ENOSPC|ENOMEM|ECONN|EPIPE/ && count++ < 100 {print substr($0, 1, 400)}' "$trace"
          printf '\n--- Startup failures ---\n'
          head -c 20000 -- "$trace"
          for generation in 1 2; do
            frame="$report/frame-$generation.jpg"
            if [[ -f "$frame" && ! -L "$frame" ]]; then
              printf '\n--- Remote JPEG %s ---\n' "$generation"
              identify -limit memory 128MiB -limit map 256MiB -format '%w %h colors=%k mean=%[fx:mean] stddev=%[fx:standard_deviation]\n' "$frame"
            fi
          done
  remote-desktop:
    if: github.server_url == 'https://github.com' && inputs.inspect_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REMOTED_REVISION: 78acffa733bb3ffe7ef10d214ab525602f996454
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      TURBOJPEG_SOURCE: vendor
      TURBOJPEG_STATIC: '1'
    steps:
      - name: Require GitHub Actions, never a local fixture
        id: github
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true || "${GITHUB_SERVER_URL:-}" != https://github.com || -n "${ACT:-}" ]]; then
            printf '::error::This probe may run only on GitHub Actions, never locally.\n'
            exit 1
          fi
          printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: pond-oci
          persist-credentials: false
      - name: Read exact reviewed inputs
        id: metadata
        run: python3 pond-oci/scripts/image-metadata.py --revision "$GITHUB_SHA" --format github >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ca-x/oci-kit
          ref: ${{ steps.metadata.outputs.kit_revision }}
          path: oci-kit
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ca-x/lightos-remote-desktop
          ref: ${{ env.REMOTED_REVISION }}
          path: remoted
          persist-credentials: false
      - name: Install runner-only fixture and remote desktop build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            musl-tools libarchive-tools bubblewrap xvfb imagemagick strace \
            libwayland-dev libxkbcommon-dev libpulse-dev libpipewire-0.3-dev \
            libspa-0.2-dev libclang-dev cmake nasm pkg-config
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          workspaces: |
            remoted -> target
            oci-kit -> target
          env-vars: TURBOJPEG_SOURCE TURBOJPEG_STATIC CC_x86_64_unknown_linux_musl CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          cache-on-failure: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Build reviewed static Rust commands only on GitHub
        run: cargo +stable build --locked --release --manifest-path oci-kit/Cargo.toml --workspace --bins --target x86_64-unknown-linux-musl
      - name: Restore only the locked public archive on GitHub
        id: rootfs-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: pond-oci/.cache/${{ steps.metadata.outputs.rootfs_sha256 }}/pond-rootfs.tar.zst
          key: pond-rootfs-${{ steps.metadata.outputs.rootfs_sha256 }}
      - name: Download the verified locked rootfs only on GitHub
        env:
          ROOTFS_FETCH: ${{ github.workspace }}/oci-kit/target/x86_64-unknown-linux-musl/release/rootfs-fetch
        run: bash pond-oci/scripts/fetch-rootfs.sh --locked
      - name: Cache the successfully verified archive before runtime preparation
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: pond-oci/.cache/${{ steps.metadata.outputs.rootfs_sha256 }}/pond-rootfs.tar.zst
          key: pond-rootfs-${{ steps.metadata.outputs.rootfs_sha256 }}
      - name: Prepare a disposable runtime root, never an image build context
        env:
          ROOTFS_SHA256: ${{ steps.metadata.outputs.rootfs_sha256 }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]]
          df -h "$RUNNER_TEMP"
          root="$RUNNER_TEMP/pond-runtime-fixture"
          tools="$GITHUB_WORKSPACE/oci-kit/target/x86_64-unknown-linux-musl/release"
          sudo install -d -m 0755 "$root"
          sudo bsdtar --numeric-owner --acls --xattrs -xpf "pond-oci/.cache/$ROOTFS_SHA256/pond-rootfs.tar.zst" -C "$root"
          sudo "$tools/rootfs-cleaner" mark --root "$root"
          sudo install -d -m 0755 "$RUNNER_TEMP/pond-remote-report"
          sudo "$tools/lighos-init" prepare-keyrings --root "$root" \
            --config pond-oci/profiles/lightos.toml --apply
          sudo ls -ld "$root/etc/resolv.conf"
          sudo bwrap --unshare-pid --unshare-ipc --unshare-uts --hostname pond-package-ci \
            --die-with-parent --bind "$root" / --proc /proc --dev /dev \
            --dir /run/systemd/resolve \
            --ro-bind /etc/resolv.conf /run/systemd/resolve/stub-resolv.conf --clearenv \
            --setenv PATH /usr/bin:/bin --setenv LANG C.UTF-8 \
            /usr/bin/pacman -Syu --noconfirm --needed cage python-pillow
          sudo bwrap --unshare-pid --unshare-ipc --unshare-net --unshare-uts \
            --die-with-parent --bind "$root" / --proc /proc --dev /dev --clearenv \
            --setenv PATH /usr/bin:/bin --setenv LANG C.UTF-8 \
            /usr/bin/pacman -Q | sudo tee "$RUNNER_TEMP/pond-remote-report/packages.txt" > /dev/null
          sudo "$tools/rootfs-cleaner" clean --root "$root" --policy pond-oci/profiles/cleanup.toml --apply
          sudo "$tools/lighos-init" install --root "$root" --config pond-oci/profiles/lightos.toml
      - name: Build reviewed remote desktop frontend only on GitHub
        working-directory: remoted
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Build reviewed remote desktop binary only on GitHub
        working-directory: remoted
        run: cargo build --locked --release --features bundled-jpeg
      - name: Probe the prepared Pond payload through its native remote desktop
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" \
            python3 pond-oci/scripts/probe-remote-desktop.py \
            --root "$RUNNER_TEMP/pond-runtime-fixture" \
            --report "$RUNNER_TEMP/pond-remote-report" \
            --binary "$GITHUB_WORKSPACE/remoted/target/release/lightos-remoted"
      - name: Stage a fresh desktop image root without fixture accounts or authentication
        if: inputs.build_candidate
        env:
          ROOTFS_SHA256: ${{ steps.metadata.outputs.rootfs_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf -- "$RUNNER_TEMP/pond-runtime-fixture"
          sudo env GITHUB_ACTIONS=true GITHUB_SERVER_URL="$GITHUB_SERVER_URL" RUNNER_TEMP="$RUNNER_TEMP" \
            ROOTFS_SHA256="$ROOTFS_SHA256" \
            KIT_BINARIES="$GITHUB_WORKSPACE/oci-kit/target/x86_64-unknown-linux-musl/release" \
            REMOTED_BINARY="$GITHUB_WORKSPACE/remoted/target/release/lightos-remoted" \
            bash pond-oci/scripts/stage-desktop.sh
      - name: Construct one unpublished linux amd64 desktop OCI artifact
        if: inputs.build_candidate
        env:
          IMAGE_VERSION: ${{ steps.metadata.outputs.version }}
          KIT_REVISION: ${{ steps.metadata.outputs.kit_revision }}
          ROOTFS_SHA256: ${{ steps.metadata.outputs.rootfs_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/pond-desktop-context"
          mkdir "$context"
          sudo tar --format=pax --numeric-owner --xattrs --acls \
            -cpf "$context/rootfs.tar" -C "$RUNNER_TEMP/pond-image-root" .
          sudo docker buildx create --name pond-desktop-candidate --driver docker-container --use
          sudo docker buildx build --platform linux/amd64 --provenance=false \
            --file pond-oci/Dockerfile.desktop \
            --build-arg "IMAGE_VERSION=$IMAGE_VERSION" --build-arg "RECIPE_REVISION=$GITHUB_SHA" \
            --build-arg "OCI_KIT_REVISION=$KIT_REVISION" --build-arg "REMOTED_REVISION=$REMOTED_REVISION" \
            --build-arg "ROOTFS_SHA256=$ROOTFS_SHA256" \
            --tag "pond-lightos:$IMAGE_VERSION" \
            --output "type=oci,dest=$RUNNER_TEMP/pond-desktop.oci.tar" "$context"
          sudo rm -- "$context/rootfs.tar"
          sudo chmod 0644 "$RUNNER_TEMP/pond-desktop.oci.tar"
          sudo sha256sum "$RUNNER_TEMP/pond-desktop.oci.tar" | sudo tee "$RUNNER_TEMP/pond-image-report/archive.sha256"
      - name: Inspect the actual OCI config before retaining the candidate
        if: inputs.build_candidate
        env:
          IMAGE_VERSION: ${{ steps.metadata.outputs.version }}
          KIT_REVISION: ${{ steps.metadata.outputs.kit_revision }}
          ROOTFS_SHA256: ${{ steps.metadata.outputs.rootfs_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y skopeo rsync
          sudo skopeo inspect --config "oci-archive:$RUNNER_TEMP/pond-desktop.oci.tar" \
            | sudo tee "$RUNNER_TEMP/pond-image-report/config.json" > /dev/null
          jq -e --arg version "$IMAGE_VERSION" --arg revision "$GITHUB_SHA" \
            --arg kit "$KIT_REVISION" --arg remoted "$REMOTED_REVISION" --arg rootfs "$ROOTFS_SHA256" \
            '.architecture == "amd64" and .os == "linux" and .config.Cmd == ["/sbin/init"] and
             .config.StopSignal == "SIGRTMIN+3" and
             .config.Labels["org.opencontainers.image.version"] == $version and
             .config.Labels["org.opencontainers.image.revision"] == $revision and
             .config.Labels["eu.ca-x.oci-kit.revision"] == $kit and
             .config.Labels["eu.ca-x.lightos-remoted.revision"] == $remoted and
             .config.Labels["so.butterfly.rootfs.sha256"] == $rootfs' \
            "$RUNNER_TEMP/pond-image-report/config.json"
      - name: Inspect the actual final layer with the reviewed Rust archive reader
        if: inputs.build_candidate
        shell: bash
        run: |
          set -euo pipefail
          layout="$RUNNER_TEMP/pond-image-layout"
          sudo skopeo copy "oci-archive:$RUNNER_TEMP/pond-desktop.oci.tar" "oci:$layout:candidate"
          manifest="$(jq -er '.manifests | select(length == 1) | .[0].digest | select(test("^sha256:[0-9a-f]{64}$")) | split(":")[1]' "$layout/index.json")"
          layer="$(jq -er '.layers | select(length == 1) | .[0].digest | select(test("^sha256:[0-9a-f]{64}$")) | split(":")[1]' "$layout/blobs/sha256/$manifest")"
          tools="$GITHUB_WORKSPACE/oci-kit/target/x86_64-unknown-linux-musl/release"
          sudo "$tools/rootfs-inspect" --archive "$layout/blobs/sha256/$layer" \
            --select . \
            --text etc/lightos/remote-desktop-native.env \
            | sudo tee "$RUNNER_TEMP/pond-image-report/layer.json" > /dev/null
          python3 pond-oci/scripts/check-desktop-layer.py \
            --report "$RUNNER_TEMP/pond-image-report/layer.json"
          final="$RUNNER_TEMP/pond-final-root"
          sudo mkdir "$final"
          sudo bsdtar --numeric-owner --xattrs --acls \
            -xpf "$layout/blobs/sha256/$layer" -C "$final"
          sudo rsync -aHAXnci --numeric-ids --delete \
            "$RUNNER_TEMP/pond-image-root/" "$final/" \
            | tee "$RUNNER_TEMP/pond-image-report/rootfs-differences.txt"
          if [[ -s "$RUNNER_TEMP/pond-image-report/rootfs-differences.txt" ]]; then
            printf '::error::Final OCI payload differs from the staged rootfs.\n'
            exit 1
          fi
      - name: Preserve the unpublished desktop candidate only on GitHub
        if: inputs.build_candidate && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pond-desktop-amd64-candidate
          path: |
            ${{ runner.temp }}/pond-desktop.oci.tar
            ${{ runner.temp }}/pond-image-report
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Print bounded remote desktop diagnostic tails
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /proc/sys/kernel/random/uuid)"
          trap 'printf "::%s::\n" "$token"' EXIT
          printf '::stop-commands::%s\n' "$token"
          shopt -s nullglob
          report="$RUNNER_TEMP/pond-remote-report"
          paths=("$report/evidence.json" "$report/owner.log" "$report/commands.log" "$report/desktop.log" "$report/dbus.log" "$report/native-syscalls.log" "$report/xvfb.log" "$report"/transport*.log "$report/x11-comparison/evidence.json" "$report/x11-comparison/desktop.log" "$report/x11-comparison/pond-ipc.txt")
          for path in "${paths[@]:0:16}"; do
            if [[ -f "$path" && ! -L "$path" ]]; then
              printf '\n--- %s ---\n' "${path##*/}"
              sudo tail -c 24000 -- "$path"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.github.outputs.enabled == 'true'
        with:
          name: pond-remote-desktop-report
          path: ${{ runner.temp }}/pond-remote-report
          if-no-files-found: ignore
          retention-days: 7
